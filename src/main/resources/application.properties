# Default sender for outgoing mail.
quarkus.mailer.from=no-reply@jrobertgardzinski.com

# In dev, don't actually send — log the mail instead. In tests, MockMailbox intercepts sends.
%dev.quarkus.mailer.mock=true

# The REST boundary sends at most this many mails per minute (429 above it; 0 disables) — one
# runaway caller must not flood the SMTP server through us.
mail.rate-limit.per-minute=${MAIL_RATE_LIMIT_PER_MINUTE:120}
%test.mail.rate-limit.per-minute=10000

# Shared secret required in the X-Api-Key header; only trusted services may send (not an open relay).
# REQUIRED at deploy, exactly like the SMTP host below and for the same reason: the default used to
# be the literal "changeme", which is in this repository — so a deploy that forgot MAIL_API_KEY came
# up as an open relay keyed by a publicly known string instead of refusing to come up at all.
mail.api-key=${MAIL_API_KEY}
%dev.mail.api-key=dev-key
%test.mail.api-key=test-key

# Production SMTP. The host is REQUIRED at deploy (startup fails fast if unset, rather than silently
# dropping mail); the rest have safe defaults for a modern submission endpoint (587 + STARTTLS).
# Provide credentials via the environment — never commit them.
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${MAIL_SMTP_HOST}
%prod.quarkus.mailer.port=${MAIL_SMTP_PORT:587}
%prod.quarkus.mailer.username=${MAIL_SMTP_USERNAME}
%prod.quarkus.mailer.password=${MAIL_SMTP_PASSWORD}
%prod.quarkus.mailer.start-tls=${MAIL_SMTP_START_TLS:REQUIRED}
%prod.quarkus.mailer.from=${MAIL_FROM:no-reply@jrobertgardzinski.com}

# Mail requests arrive asynchronously from Kafka (microservice-security's outbox publishes them);
# the broker comes from the environment. Dev Services stay off — the compose stack provides Kafka.
quarkus.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.mail-requests.connector=smallrye-kafka
mp.messaging.incoming.mail-requests.topic=mail-requests
mp.messaging.incoming.mail-requests.auto.offset.reset=earliest
# The `throttled` commit strategy calls a record older than this a FATAL error and closes the
# consumer client — permanently, until someone restarts the pod. Its 60 s default is shorter than
# this service's own retry budget: an SMTP outage makes every record take ~7 s (3 retries, 1→8 s
# backoff), so nine queued mails are enough to age the oldest past the limit. The channel then dies
# in the middle of the outage it was built to survive, and no mail — verification, password reset,
# MFA code, i.e. LOGIN — goes out again. 0 disables the age check; the retry budget stays the real
# deadline, and the volume here does not need a second one.
mp.messaging.incoming.mail-requests.throttled.unprocessed-record-max-age.ms=0
# A send that keeps failing is parked here with its failure attached (see MailRequestsConsumer).
mp.messaging.outgoing.mail-requests-dlq.connector=smallrye-kafka
mp.messaging.outgoing.mail-requests-dlq.topic=mail-requests-dlq
# ... and read back for the operator's ledger (GET /mails/dlq, POST /mails/dlq/{id}/redrive).
#
# The ledger is in memory, so it must be rebuilt from the WHOLE topic at every start, not resumed.
# It used to do the opposite: no auto.offset.reset meant `latest` and offsets were committed, so a
# restart during an outage — the likeliest moment for one — brought the service back with an empty
# ledger and a consumer that would not re-read what it had already seen. The mails were still on
# the topic; nothing in the system could show them any more, which is precisely what the javadoc
# on ParkedMails promises it can. A per-start group id plus `earliest` and no commits makes this
# channel a pure replay, matching that promise. Redriven entries are retracted by a marker record
# (see MailRequestsConsumer#markRedriven), so replay does not resurrect what an operator settled.
mp.messaging.incoming.mail-requests-dlq-in.connector=smallrye-kafka
mp.messaging.incoming.mail-requests-dlq-in.topic=mail-requests-dlq
mp.messaging.incoming.mail-requests-dlq-in.group.id=mail-dlq-ledger-${quarkus.uuid}
mp.messaging.incoming.mail-requests-dlq-in.auto.offset.reset=earliest
mp.messaging.incoming.mail-requests-dlq-in.commit-strategy=ignore
# In tests the channels run on the in-memory connector — no broker, no Docker.
%test.mp.messaging.incoming.mail-requests.connector=smallrye-in-memory
%test.mp.messaging.outgoing.mail-requests-dlq.connector=smallrye-in-memory
%test.mp.messaging.incoming.mail-requests-dlq-in.connector=smallrye-in-memory

# observability: the correlation id restored from the mail-request's Kafka header rides the log
# line (cid=... when present), matching the [cid=...] the other services print — so a mail traces
# back to the request that asked for it.
# the stack's shared log line (observability/README.md): ISO time, level, cid, trace
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZZZ} %-5p [cid=%X{cid}] [trace=%X{trace_id}] %c{2.} - %s%e%n
